apiVersion: v1
kind: ServiceAccount
metadata:
  name: todoapp-service-account
  namespace: todoapp

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: todoapp-role
  namespace: todoapp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: todoapp-role
  namespace: todoapp
subjects:
  - kind: ServiceAccount
    name: todoapp-service-account
    namespace: todoapp
roleRef:
  kind: Role
  name: todoapp-role
  apiGroup: rbac.authorization.k8s.io
